# Gera o site estático e publica no Cloudflare Pages a cada push na main.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token com a permissão "Account · Cloudflare Pages · Edit"
#   CLOUDFLARE_ACCOUNT_ID  ID da conta na Cloudflare

name: Deploy

on:
  push:
    branches: [main]
    # Mudanças só no README ou nos prints não precisam publicar o site de novo.
    paths-ignore:
      - 'README*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Autoload do Composer
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist

      - name: Cache do Tailwind CLI
        uses: actions/cache@v6
        with:
          path: .tools
          key: tailwind-${{ runner.os }}-${{ hashFiles('bin/tailwind') }}

      - name: Build (CSS + HTML estático em dist/)
        run: composer build

      - name: Publicar no Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          WRANGLER: npx --yes wrangler@4.165.0
        run: |
          # Cria o projeto no Pages na primeira vez; nas próximas, só publica.
          $WRANGLER pages project list | grep -q 'vmadalosso-dev' \
            || $WRANGLER pages project create vmadalosso-dev --production-branch=main
          $WRANGLER pages deploy dist --project-name=vmadalosso-dev --branch=main
